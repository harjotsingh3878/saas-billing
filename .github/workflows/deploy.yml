name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

env:
  NODE_VERSION: '18'
  AWS_REGION: 'us-east-1'

jobs:
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install all dependencies (workspaces)
        run: npm ci
      
      - name: Build all packages and services
        run: npm run build
      
      - name: Deploy CDK stacks
        run: |
          cd infra/aws-cdk
          npm ci
          npm run cdk deploy -- --all --require-approval never
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
      
      - name: Get stack outputs
        id: stack-outputs
        run: |
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name SaasBillingAuthStack \
            --query 'Stacks[0].Outputs[?OutputKey==`UserPoolId`].OutputValue' \
            --output text)
          
          CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name SaasBillingAuthStack \
            --query 'Stacks[0].Outputs[?OutputKey==`UserPoolClientId`].OutputValue' \
            --output text)
          
          EVENT_BUS=$(aws cloudformation describe-stacks \
            --stack-name SaasBillingEventStack \
            --query 'Stacks[0].Outputs[?OutputKey==`EventBusName`].OutputValue' \
            --output text)
          
          echo "user_pool_id=$USER_POOL_ID" >> $GITHUB_OUTPUT
          echo "client_id=$CLIENT_ID" >> $GITHUB_OUTPUT
          echo "event_bus=$EVENT_BUS" >> $GITHUB_OUTPUT
      
      - name: Deploy Lambda functions
        run: |
          chmod +x ./scripts/deploy-lambdas.sh
          ./scripts/deploy-lambdas.sh
        env:
          USER_POOL_ID: ${{ steps.stack-outputs.outputs.user_pool_id }}
          EVENT_BUS_NAME: ${{ steps.stack-outputs.outputs.event_bus }}

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      
      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
      
      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_GATEWAY_URL }}
      
      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
